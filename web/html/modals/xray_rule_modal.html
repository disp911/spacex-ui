{{define "modals/ruleModal"}}
<a-modal id="rule-modal" v-model="ruleModal.visible" :title="ruleModal.title" @ok="ruleModal.ok"
  :confirm-loading="ruleModal.confirmLoading" :closable="true" :mask-closable="false" :ok-text="ruleModal.okText"
  cancel-text='{{ i18n "close" }}' :class="themeSwitcher.currentTheme">
  <a-form :colon="false" :label-col="{ md: {span:8} }" :wrapper-col="{ md: {span:14} }">
    <a-form-item>
      <template slot="label">
        <a-tooltip>
          <template slot="title">
            <span>{{ i18n "pages.xray.rules.useComma" }}</span>
          </template> Source IPs <a-icon type="question-circle"></a-icon>
        </a-tooltip>
      </template>
      <a-select mode="tags" v-model="ruleModal.rule.sourceIP" :token-separators="[',']"
        :filter-option="ruleModal.filterOption" placeholder="e.g. 0.0.0.0/8, fc00::/7, geoip:ir"
        :dropdown-class-name="themeSwitcher.currentTheme">
        <a-select-option v-for="p in ruleModal.catalog.ip" :key="p.value" :value="p.value" :label="p.label">
          <span>[[ p.label ]]</span>
        </a-select-option>
      </a-select>
    </a-form-item>
    <a-form-item>
      <template slot="label">
        <a-tooltip>
          <template slot="title">
            <span>{{ i18n "pages.xray.rules.useComma" }}</span>
          </template> Source Port <a-icon type="question-circle"></a-icon>
        </a-tooltip>
      </template>
      <a-input v-model.trim="ruleModal.rule.sourcePort" placeholder="e.g. 53,443,1000-2000"></a-input>
    </a-form-item>
    <a-form-item>
      <template slot="label">
        <a-tooltip>
          <template slot="title">
            <span>{{ i18n "pages.xray.rules.useComma" }}</span>
          </template> VLESS Route <a-icon type="question-circle"></a-icon>
        </a-tooltip>
      </template>
      <a-input v-model.trim="ruleModal.rule.vlessRoute" placeholder="e.g. 53,443,1000-2000"></a-input>
    </a-form-item>
    <a-form-item label='Network'>
      <a-select v-model="ruleModal.rule.network" :dropdown-class-name="themeSwitcher.currentTheme">
        <a-select-option v-for="x in ['','TCP','UDP','TCP,UDP']" :value="x">[[ x ]]</a-select-option>
      </a-select>
    </a-form-item>
    <a-form-item label='Protocol'>
      <a-select v-model="ruleModal.rule.protocol" mode="multiple" :dropdown-class-name="themeSwitcher.currentTheme">
        <a-select-option v-for="x in ['http','tls','bittorrent','quic']" :value="x">[[ x ]]</a-select-option>
      </a-select>
    </a-form-item>
    <a-form-item label='Attributes'>
      <a-button icon="plus" size="small" :style="{ marginLeft: '10px' }"
        @click="ruleModal.rule.attrs.push(['', ''])"></a-button>
    </a-form-item>
    <a-form-item :wrapper-col="{span: 24}">
      <a-input-group compact v-for="(attr,index) in ruleModal.rule.attrs">
        <a-input :style="{ width: '50%' }" v-model="attr[0]"
          placeholder='{{ i18n "pages.inbounds.stream.general.name" }}'>
          <template slot="addonBefore" :style="{ margin: '0' }">[[ index+1 ]]</template>
        </a-input>
        <a-input :style="{ width: '50%' }" v-model="attr[1]"
          placeholder='{{ i18n "pages.inbounds.stream.general.value" }}'>
          <a-button icon="minus" slot="addonAfter" size="small"
            @click="ruleModal.rule.attrs.splice(index,1)"></a-button>
        </a-input>
      </a-input-group>
    </a-form-item>
    <a-form-item>
      <template slot="label">
        <a-tooltip>
          <template slot="title">
            <span>{{ i18n "pages.xray.rules.useComma" }}</span>
          </template> IP <a-icon type="question-circle"></a-icon>
        </a-tooltip>
      </template>
      <a-select mode="tags" v-model="ruleModal.rule.ip" :token-separators="[',']"
        :filter-option="ruleModal.filterOption" placeholder="e.g. 0.0.0.0/8, fc00::/7, geoip:ir"
        :dropdown-class-name="themeSwitcher.currentTheme">
        <a-select-option v-for="p in ruleModal.catalog.ip" :key="p.value" :value="p.value" :label="p.label">
          <span>[[ p.label ]]</span>
        </a-select-option>
      </a-select>
    </a-form-item>
    <a-form-item>
      <template slot="label">
        <a-tooltip>
          <template slot="title">
            <span>{{ i18n "pages.xray.rules.useComma" }}</span>
          </template> Domain <a-icon type="question-circle"></a-icon>
        </a-tooltip>
      </template>
      <a-select mode="tags" v-model="ruleModal.rule.domain" :token-separators="[',']"
        :filter-option="ruleModal.filterOption" placeholder="e.g. google.com, geosite:cn"
        :dropdown-class-name="themeSwitcher.currentTheme">
        <a-select-opt-group v-for="group in ruleModal.catalog.domain.filter(g => g.options.length > 0)"
          :key="group.label" :label="group.label">
          <a-select-option v-for="p in group.options" :key="p.value" :value="p.value" :label="p.label">
            <span>[[ p.label ]]</span>
          </a-select-option>
        </a-select-opt-group>
      </a-select>
    </a-form-item>
    <a-form-item>
      <template slot="label">
        <a-tooltip>
          <template slot="title">
            <span>{{ i18n "pages.xray.rules.useComma" }}</span>
          </template> User <a-icon type="question-circle"></a-icon>
        </a-tooltip>
      </template>
      <a-input v-model.trim="ruleModal.rule.user" placeholder="e.g. email address"></a-input>
    </a-form-item>
    <a-form-item>
      <template slot="label">
        <a-tooltip>
          <template slot="title">
            <span>{{ i18n "pages.xray.rules.useComma" }}</span>
          </template> Port <a-icon type="question-circle"></a-icon>
        </a-tooltip>
      </template>
      <a-input v-model.trim="ruleModal.rule.port" placeholder="e.g. 53,443,1000-2000"></a-input>
    </a-form-item>
    <a-form-item label='Inbound Tags'>
      <a-select v-model="ruleModal.rule.inboundTag" mode="multiple" :dropdown-class-name="themeSwitcher.currentTheme">
        <a-select-option v-for="tag in ruleModal.inboundTags" :value="tag">[[ tag ]]</a-select-option>
      </a-select>
    </a-form-item>
    <a-form-item label='Outbound Tag'>
      <a-select v-model="ruleModal.rule.outboundTag" :dropdown-class-name="themeSwitcher.currentTheme">
        <a-select-option v-for="tag in ruleModal.outboundTags" :value="tag">[[ tag ]]</a-select-option>
      </a-select>
    </a-form-item>
    <a-form-item>
      <template slot="label">
        <a-tooltip>
          <template slot="title">
            <span>{{ i18n "pages.xray.balancer.balancerDesc" }}</span>
          </template> Balancer Tag <a-icon type="question-circle"></a-icon>
        </a-tooltip>
      </template>
      <a-select v-model="ruleModal.rule.balancerTag" :dropdown-class-name="themeSwitcher.currentTheme">
        <a-select-option v-for="tag in ruleModal.balancerTags" :value="tag">[[ tag ]]</a-select-option>
      </a-select>
    </a-form-item>
  </a-form>
</a-modal>
<script>
  const ruleModal = {
    title: '',
    visible: false,
    confirmLoading: false,
    okText: '{{ i18n "sure" }}',
    isEdit: false,
    confirm: null,
    rule: {
      type: "field",
      domain: [],
      ip: [],
      port: "",
      sourcePort: "",
      vlessRoute: "",
      network: "",
      sourceIP: [],
      user: "",
      inboundTag: [],
      protocol: [],
      attrs: [],
      outboundTag: "",
      balancerTag: "",
    },
    catalog: {
      ip: [],
      domain: [],
    },
    inboundTags: [],
    outboundTags: [],
    users: [],
    balancerTags: [],
    ok() {
      newRule = ruleModal.getResult();
      ObjectUtil.execute(ruleModal.confirm, newRule);
    },
    show({
      title = '',
      okText = '{{ i18n "sure" }}',
      rule,
      confirm = (rule) => {},
      isEdit = false
    }) {
      this.title = title;
      this.okText = okText;
      this.confirm = confirm;
      this.visible = true;
      if (isEdit) {
        this.rule.domain = rule.domain ? [...rule.domain] : [];
        this.rule.ip = rule.ip ? [...rule.ip] : [];
        this.rule.port = rule.port;
        this.rule.sourcePort = rule.sourcePort;
        this.rule.vlessRoute = rule.vlessRoute;
        this.rule.network = rule.network;
        this.rule.sourceIP = rule.sourceIP ? [...rule.sourceIP] : [];
        this.rule.user = rule.user ? rule.user.join(',') : [];
        this.rule.inboundTag = rule.inboundTag;
        this.rule.protocol = rule.protocol;
        this.rule.attrs = rule.attrs ? Object.entries(rule.attrs) : [];
        this.rule.outboundTag = rule.outboundTag;
        this.rule.balancerTag = rule.balancerTag ? rule.balancerTag : "";
      } else {
        this.rule = {
          domain: [],
          ip: [],
          port: "",
          sourcePort: "",
          vlessRoute: "",
          network: "",
          sourceIP: [],
          user: "",
          inboundTag: [],
          protocol: [],
          attrs: [],
          outboundTag: "",
          balancerTag: "",
        }
      }
      this.isEdit = isEdit;
      this.catalog = app.ruleCatalog;
      this.inboundTags = app.templateSettings.inbounds.filter((i) => !ObjectUtil.isEmpty(i.tag)).map(obj => obj.tag);
      this.inboundTags.push(...app.inboundTags);
      if (app.enableDNS && !ObjectUtil.isEmpty(app.dnsTag)) this.inboundTags.push(app.dnsTag)
      this.outboundTags = ["", ...app.templateSettings.outbounds.filter((o) => !ObjectUtil.isEmpty(o.tag)).map(obj =>
        obj.tag)];
      if (app.clientReverseTags) {
        app.clientReverseTags.forEach(tag => {
          if (tag && !this.outboundTags.includes(tag)) {
            this.outboundTags.push(tag);
          }
        });
      }
      this.balancerTags = [""];
      if (app.templateSettings.routing && app.templateSettings.routing.balancers) {
        this.balancerTags = ["", ...app.templateSettings.routing.balancers.filter((o) => !ObjectUtil.isEmpty(o.tag))
          .map(obj => obj.tag)
        ];
      }
    },
    // Pasted lists are split on commas, which can leave stray spaces and empty items.
    cleanList(list) {
      return list.map(s => s.trim()).filter(s => s.length > 0);
    },
    // Catalog entries are found by their readable name as well as by the value
    // that goes into the config, so both "russia" and "geoip_RU" find them.
    filterOption(input, option) {
      const props = option.componentOptions.propsData;
      const query = input.toLowerCase();
      return [props.value, props.label].some(v => String(v ?? '').toLowerCase().includes(query));
    },
    close() {
      ruleModal.visible = false;
      ruleModal.loading(false);
    },
    loading(loading = true) {
      ruleModal.confirmLoading = loading;
    },
    getResult() {
      value = ruleModal.rule;
      rule = {};
      newRule = {};
      rule.type = "field";
      rule.domain = ruleModal.cleanList(value.domain);
      rule.ip = ruleModal.cleanList(value.ip);
      rule.port = value.port;
      rule.sourcePort = value.sourcePort;
      rule.vlessRoute = value.vlessRoute;
      rule.network = value.network;
      rule.sourceIP = ruleModal.cleanList(value.sourceIP);
      rule.user = value.user.length > 0 ? value.user.split(',').map(s => s.trim()) : [];
      rule.inboundTag = value.inboundTag;
      rule.protocol = value.protocol;
      rule.attrs = Object.fromEntries(value.attrs);
      rule.outboundTag = value.outboundTag == "" ? undefined : value.outboundTag;
      rule.balancerTag = value.balancerTag == "" ? undefined : value.balancerTag;
      for (const [key, value] of Object.entries(rule)) {
        if (value !== null && value !== undefined && !(Array.isArray(value) && value.length === 0) && !(
            typeof value === 'object' && Object.keys(value).length === 0) && value !== '') {
          newRule[key] = value;
        }
      }
      return newRule;
    }
  };
  new Vue({
    delimiters: ['[[', ']]'],
    el: '#rule-modal',
    data: {
      ruleModal: ruleModal,
    }
  });
</script>
{{end}}
