{{define "form/mtproto"}}
<a-collapse activeKey="0" v-for="(client, index) in inbound.settings.mtprotos.slice(0,1)" v-if="!isEdit">
  <a-collapse-panel header='{{ i18n "pages.inbounds.client" }}'>
    {{template "form/client" .}}
  </a-collapse-panel>
</a-collapse>
<a-collapse v-else>
  <a-collapse-panel :header="'{{ i18n "pages.client.clientCount"}} : ' + inbound.settings.mtprotos.length">
    <table width="100%">
      <tr class="client-table-header">
        <th>{{ i18n "pages.inbounds.email" }}</th>
        <th>Secret</th>
      </tr>
      <tr v-for="(client, index) in inbound.settings.mtprotos" :class="index % 2 == 1 ? ' client-table-odd-row' : ''">
        <td>[[ client.email ]]</td>
        <td>[[ client.id ]]</td>
      </tr>
    </table>
  </a-collapse-panel>
</a-collapse>
<a-form :colon="false" :label-col="{ md: {span:8} }" :wrapper-col="{ md: {span:14} }">
  <a-form-item>
    <template slot="label">
      <a-tooltip>
        <template slot="title">
          <span>{{ i18n "pages.inbounds.mtprotoDomainDesc" }}</span>
        </template>
        {{ i18n "pages.inbounds.mtprotoDomain" }}
        <a-icon type="question-circle"></a-icon>
      </a-tooltip>
    </template>
    <a-input v-model.trim="inbound.settings.tlsDomain" placeholder="www.example.com"></a-input>
  </a-form-item>
  <a-form-item>
    <template slot="label">
      <a-tooltip>
        <template slot="title">
          <span>{{ i18n "pages.inbounds.mtprotoWebDesc" }}</span>
        </template>
        {{ i18n "pages.inbounds.mtprotoWeb" }}
        <a-icon type="question-circle"></a-icon>
      </a-tooltip>
    </template>
    <a-switch v-model="mtprotoWebEnabled"></a-switch>
    <div v-if="mtprotoWebEnabled && !mtprotoWebFrontOk" :style="{ color: '#FFA031', lineHeight: '1.4', marginTop: '4px' }">
      {{ i18n "pages.inbounds.mtprotoWebNeedsHttps" }}
    </div>
  </a-form-item>
  <template v-if="mtprotoWebEnabled">
    <a-form-item>
      <template slot="label">
        <a-tooltip>
          <template slot="title">
            <span>{{ i18n "pages.inbounds.mtprotoWebHostDesc" }}</span>
          </template>
          {{ i18n "pages.inbounds.mtprotoWebHost" }}
          <a-icon type="question-circle"></a-icon>
        </a-tooltip>
      </template>
      <a-input v-model.trim="inbound.settings.web.host" placeholder="proxy.example.com"></a-input>
    </a-form-item>
    <a-form-item>
      <template slot="label">
        <a-tooltip>
          <template slot="title">
            <span>{{ i18n "pages.inbounds.mtprotoWebIpDesc" }}</span>
          </template>
          {{ i18n "pages.inbounds.mtprotoWebIp" }}
          <a-icon type="question-circle"></a-icon>
        </a-tooltip>
      </template>
      <a-input v-model.trim="inbound.settings.web.publicIp"
        placeholder='{{ i18n "pages.inbounds.mtprotoWebIpAuto" }}'></a-input>
    </a-form-item>
    <a-form-item v-if="inbound.settings.web.path">
      <template slot="label">
        <a-tooltip>
          <template slot="title">
            <span>{{ i18n "pages.inbounds.mtprotoWebPathDesc" }}</span>
          </template>
          {{ i18n "pages.inbounds.mtprotoWebPath" }}
          <a-icon type="sync" @click="inbound.settings.web.path = ''"></a-icon>
        </a-tooltip>
      </template>
      <a-input :value="inbound.settings.web.path" disabled></a-input>
    </a-form-item>
  </template>
</a-form>
{{template "form/externalProxy" .}}
{{end}}
