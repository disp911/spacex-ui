{{define "form/mtproto"}}
<a-collapse activeKey="0" v-for="(client, index) in inbound.settings.mtprotos.slice(0,1)" v-if="!isEdit">
  <a-collapse-panel header='{{ i18n "pages.inbounds.client" }}'>
    {{template "form/client" .}}
  </a-collapse-panel>
</a-collapse>
<a-collapse v-else>
  <a-collapse-panel :header="'{{ i18n "pages.client.clientCount"}} : ' + inbound.settings.mtprotos.length">
    <table width="100%">
      <tr class="client-table-header">
        <th>{{ i18n "pages.inbounds.email" }}</th>
        <th>Secret</th>
      </tr>
      <tr v-for="(client, index) in inbound.settings.mtprotos" :class="index % 2 == 1 ? ' client-table-odd-row' : ''">
        <td>[[ client.email ]]</td>
        <td>[[ client.id ]]</td>
      </tr>
    </table>
  </a-collapse-panel>
</a-collapse>
<a-form :colon="false" :label-col="{ md: {span:8} }" :wrapper-col="{ md: {span:14} }">
  <a-form-item>
    <template slot="label">
      <a-tooltip>
        <template slot="title">
          <span>{{ i18n "pages.inbounds.mtprotoDomainDesc" }}</span>
        </template>
        {{ i18n "pages.inbounds.mtprotoDomain" }}
        <a-icon type="question-circle"></a-icon>
      </a-tooltip>
    </template>
    <a-input v-model.trim="inbound.settings.tlsDomain" placeholder="www.example.com"></a-input>
  </a-form-item>
  <a-form-item>
    <template slot="label">
      <a-tooltip>
        <template slot="title">
          <span>{{ i18n "pages.inbounds.mtprotoOutboundDesc" }}</span>
        </template>
        {{ i18n "pages.inbounds.mtprotoOutbound" }}
        <a-icon type="question-circle"></a-icon>
      </a-tooltip>
    </template>
    <a-select v-model="inbound.settings.outboundTag" :dropdown-class-name="themeSwitcher.currentTheme">
      <a-select-option value="">{{ i18n "pages.inbounds.mtprotoOutboundDirect" }}</a-select-option>
      <a-select-option v-for="tag in inModal.xrayOutboundTags || []" :key="tag" :value="tag">[[ tag ]]</a-select-option>
    </a-select>
    <div v-if="inbound.settings.outboundTag && inModal.xrayOutboundTags && !inModal.xrayOutboundTags.includes(inbound.settings.outboundTag)"
      :style="{ color: '#FFA031', lineHeight: '1.4', marginTop: '4px' }">
      {{ i18n "pages.inbounds.mtprotoOutboundGone" }}
    </div>
  </a-form-item>
</a-form>
{{template "form/externalProxy" .}}
{{end}}
